{% extends "layout.html" %}
{% block content %}
{% if Error %}
<div class="container error-container">
    <div class="label">错误</div>
    <div class="value">{{ Error }}</div>
</div>
{% else %}
{% set p = Profile %}

<div class="container primary-container">
    <div class="label">玩家</div>
    <div class="value" style="word-break: break-word;">{{ p.Name }}</div>
</div>

<div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
    <div class="container secondary-container" style="margin-bottom: 0;">
        <div class="label">Rank</div>
        <div class="value">{{ p.Rank }}</div>
    </div>
    <div class="container secondary-container" style="margin-bottom: 0;">
        <div class="label">服务器</div>
        <div class="value">{{ p.ServerName }}</div>
    </div>
</div>

<div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
    <div class="container secondary-container" style="margin-bottom: 0;">
        <div class="label">用户 ID</div>
        <div class="value">{{ p.UserID }}</div>
    </div>
    <div class="container secondary-container" style="margin-bottom: 0;">
        <div class="label">Server Key</div>
        <div class="value">{{ p.ServerKey }}</div>
    </div>
</div>

{% if p.MainCard %}
<div class="container" style="background: var(--color-surface-container-low); border: 1px solid var(--color-outline-variant); margin-top: 8px;">
    <div class="label">主卡</div>
    <div class="value">{{ p.MainCard }}</div>
</div>
{% endif %}
{% endif %}
{% endblock %}
